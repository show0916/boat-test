name: Build 2026 Boat Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backtest CSV
        run: |
          python3 backtest_2026.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_2026.csv data/backtest_2026_summary.json
          git diff --cached --quiet || git commit -m "Update 2026 boat backtest data"
          git push
